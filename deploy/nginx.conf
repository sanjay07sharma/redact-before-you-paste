# Example nginx site for the redaction tool.
# Copy index.html, css/, js/ and assets/ to /var/www/redact-tool/ (tests/, tools/, deploy/ are not needed).

server {
    listen 443 ssl http2;
    server_name redact.internal.example;          # ← your hostname

    # ssl_certificate     /etc/ssl/certs/redact.pem;
    # ssl_certificate_key /etc/ssl/private/redact.key;

    root  /var/www/redact-tool;
    index index.html;

    # No access logs of query strings etc. (the app never sends data, but keep logs minimal anyway)
    access_log off;

    location / {
        try_files $uri $uri/ =404;
    }

    # ES modules need the correct MIME type
    types { text/javascript js; text/css css; image/svg+xml svg; text/html html; }

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), clipboard-read=()" always;
    add_header Cache-Control "no-store" always;
}
